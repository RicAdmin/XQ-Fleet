[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

# Serve /.well-known/* from SSR routes under /well-known/* (TanStack ignores dot-prefixed route files)
[[redirects]]
  from = "/.well-known/*"
  to = "/well-known/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/"
  [headers.values]
    Link = "</.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/openid-configuration>; rel=\"openid-configuration\", </.well-known/oauth-protected-resource>; rel=\"oauth-protected-resource\", </llms.txt>; rel=\"describedby\", </auth.md>; rel=\"service-doc\""

[[headers]]
  for = "/en"
  [headers.values]
    Link = "</.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/openid-configuration>; rel=\"openid-configuration\", </.well-known/oauth-protected-resource>; rel=\"oauth-protected-resource\", </llms.txt>; rel=\"describedby\", </auth.md>; rel=\"service-doc\""

[[headers]]
  for = "/en/"
  [headers.values]
    Link = "</.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/openid-configuration>; rel=\"openid-configuration\", </.well-known/oauth-protected-resource>; rel=\"oauth-protected-resource\", </llms.txt>; rel=\"describedby\", </auth.md>; rel=\"service-doc\""
